<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Confirm Delete</title>
</head>
<body>
    <h1>Delete Person</h1>
    <p>Are you sure you want to delete "{{ person.first_name }} {{ person.last_name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'home' %}">Cancel</a>
    </form>
</body>
</html>
